<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" font-family="Geist,'Inter',Helvetica,Arial,sans-serif">
  <rect width="1200" height="720" fill="#ffffff"/>
  <text x="60" y="55" font-size="30" font-weight="600" letter-spacing="-1.1" fill="#171717">AlphaCube · one 3-D tensor, three faces, one engine</text>
  <text x="60" y="86" font-family="'DejaVu Sans Mono',Consolas,monospace" font-size="13" letter-spacing="0.5" fill="#767676">DATA = (S STOCK, D DAY, M MINUTE); THE SAME 2-D KERNEL MEANS DIFFERENT THINGS ON DIFFERENT FACES</text>
  <rect x="60" y="104" width="1080" height="2" fill="#171717"/>

  <polygon points="120,480 320,480 320,300 120,300" fill="#f5f5f5" stroke="#171717" stroke-width="2"/>
  <polygon points="120,300 320,300 390,230 190,230" fill="#ffffff" stroke="#171717" stroke-width="2"/>
  <polygon points="320,480 320,300 390,230 390,410" fill="#ebebeb" stroke="#171717" stroke-width="2"/>

  <text x="170" y="512" font-family="'DejaVu Sans Mono',Consolas,monospace" font-size="13" font-weight="600" fill="#171717">S (stock)</text>
  <text x="100" y="400" font-family="'DejaVu Sans Mono',Consolas,monospace" font-size="13" font-weight="600" fill="#171717" transform="rotate(-90 100 400)">D (day)</text>
  <text x="332" y="248" font-family="'DejaVu Sans Mono',Consolas,monospace" font-size="13" font-weight="600" fill="#171717">M (minute)</text>
  <text x="150" y="548" font-size="13" fill="#4d4d4d">One data object: the cube (S, D, M)</text>
  <text x="150" y="574" font-size="13" fill="#4d4d4d">242 searchable operators · one registry</text>

  <rect x="540" y="152" width="600" height="132" rx="8" fill="#ffffff" stroke="#171717" stroke-width="2"/>
  <text x="562" y="188" font-size="17" font-weight="600" fill="#171717">DT face · (D, M), stock fixed</text>
  <text x="562" y="216" font-family="'DejaVu Sans Mono',Consolas,monospace" font-size="11.5" fill="#767676">intraday rolling (in_*) · day reduction (day_*) · cross-day (cross_*)</text>
  <text x="562" y="240" font-family="'DejaVu Sans Mono',Consolas,monospace" font-size="11.5" fill="#767676">compute axis M, M reduced, D</text>
  <text x="562" y="264" font-family="'DejaVu Sans Mono',Consolas,monospace" font-size="11.5" fill="#767676">chunk by stock or by day</text>

  <rect x="540" y="304" width="600" height="132" rx="8" fill="#ffffff" stroke="#ebebeb" stroke-width="1.5"/>
  <text x="562" y="340" font-size="17" font-weight="600" fill="#171717">ND face · (D, S), minute axis reduced</text>
  <text x="562" y="368" font-family="'DejaVu Sans Mono',Consolas,monospace" font-size="11.5" fill="#767676">cross-section (cs_*) · time series (ts_*)</text>
  <text x="562" y="392" font-family="'DejaVu Sans Mono',Consolas,monospace" font-size="11.5" fill="#767676">the only daily panel in the old architecture; now one of three faces</text>
  <text x="562" y="416" font-family="'DejaVu Sans Mono',Consolas,monospace" font-size="11.5" fill="#767676">whole panel resident</text>

  <rect x="540" y="456" width="600" height="132" rx="8" fill="#fafafa" stroke="#d4d4d4" stroke-width="1.5"/>
  <text x="562" y="492" font-size="17" font-weight="600" fill="#171717">NT face · (M, S), day fixed (new expressiveness)</text>
  <text x="562" y="520" font-family="'DejaVu Sans Mono',Consolas,monospace" font-size="11.5" fill="#767676">intraday cross-section (nt_cs_*) · intraday time series (nt_ts_*)</text>
  <text x="562" y="544" font-family="'DejaVu Sans Mono',Consolas,monospace" font-size="11.5" fill="#767676">“rank across stocks every minute, then aggregate within the day” was impossible before</text>
  <text x="562" y="568" font-family="'DejaVu Sans Mono',Consolas,monospace" font-size="11.5" fill="#767676">day chunks, kernel call per day (the definition, not an implementation detail)</text>

  <rect x="60" y="640" width="1080" height="60" rx="8" fill="#171717"/>
  <text x="80" y="676" font-family="'DejaVu Sans Mono',Consolas,monospace" font-size="11.5" fill="#a1a1a1">ONE ENGINE (CHUNK × ROUND SCHEDULING) · ONE PARSER · TYPES: collapsed / degenerate / width · CHUNK AND ROUND INVARIANT ON CPU</text>
</svg>
