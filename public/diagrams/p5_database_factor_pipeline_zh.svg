<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" font-family="'Microsoft YaHei','Noto Sans SC','PingFang SC',sans-serif">
  <defs>
    <marker id="p5a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#a1a1a1"/>
    </marker>
  </defs>
  <rect width="1200" height="720" fill="#ffffff"/>
  <text x="60" y="55" font-size="30" font-weight="600" letter-spacing="-1.1" fill="#171717">只读数据库因子回测编排层</text>
  <text x="60" y="86" font-family="'DejaVu Sans Mono',Consolas,monospace" font-size="13" letter-spacing="0.5" fill="#767676">AGENT → SKILL 边界 → 只读数据库 → 确定性适配器 → 原始回测框架 → 可复算输出</text>
  <rect x="60" y="104" width="1080" height="2" fill="#171717"/>

  <rect x="60" y="142" width="160" height="132" rx="8" fill="#ffffff" stroke="#ebebeb" stroke-width="1.5"/>
  <text x="76" y="174" font-size="14.5" font-weight="600" fill="#171717">自然语言请求</text>
  <text x="76" y="202" font-size="11.5" fill="#4d4d4d">因子名 · 日期</text>
  <text x="76" y="224" font-size="11.5" fill="#4d4d4d">输出目录</text>
  <text x="76" y="246" font-size="11.5" fill="#767676">会话级任务</text>

  <rect x="244" y="142" width="160" height="132" rx="8" fill="#ffffff" stroke="#171717" stroke-width="2"/>
  <text x="260" y="174" font-size="14.5" font-weight="600" fill="#171717">Skill 边界</text>
  <text x="260" y="202" font-size="11.5" fill="#4d4d4d">只读契约</text>
  <text x="260" y="224" font-size="11.5" fill="#4d4d4d">遮罩密码</text>
  <text x="260" y="246" font-size="11.5" fill="#767676">无任意 SQL</text>

  <rect x="428" y="142" width="160" height="132" rx="8" fill="#ffffff" stroke="#ebebeb" stroke-width="1.5"/>
  <text x="444" y="174" font-size="14.5" font-weight="600" fill="#171717">只读数据源</text>
  <text x="444" y="202" font-size="11.5" fill="#4d4d4d">PostgreSQL 因子</text>
  <text x="444" y="224" font-size="11.5" fill="#4d4d4d">MySQL 因子库</text>
  <text x="444" y="246" font-size="11.5" fill="#767676">PG 实时收益</text>

  <rect x="612" y="142" width="160" height="132" rx="8" fill="#ffffff" stroke="#ebebeb" stroke-width="1.5"/>
  <text x="628" y="174" font-size="14.5" font-weight="600" fill="#171717">确定性适配器</text>
  <text x="628" y="202" font-size="11.5" fill="#4d4d4d">发现 → 映射</text>
  <text x="628" y="224" font-size="11.5" fill="#4d4d4d">边界审计</text>
  <text x="628" y="246" font-size="11.5" fill="#767676">统一长表输入</text>

  <rect x="796" y="142" width="160" height="132" rx="8" fill="#ffffff" stroke="#ebebeb" stroke-width="1.5"/>
  <text x="812" y="174" font-size="14.5" font-weight="600" fill="#171717">原始回测框架</text>
  <text x="812" y="202" font-size="11.5" fill="#4d4d4d">GeneratedFactorTest</text>
  <text x="812" y="224" font-size="11.5" fill="#4d4d4d">分组 · RankIC</text>
  <text x="812" y="246" font-size="11.5" fill="#767676">数值与绘图不改写</text>

  <rect x="980" y="142" width="160" height="132" rx="8" fill="#171717"/>
  <text x="996" y="174" font-size="14.5" font-weight="600" fill="#ffffff">输出</text>
  <text x="996" y="202" font-size="11.5" fill="#c9c9c9">PKL + 3 张图</text>
  <text x="996" y="224" font-size="11.5" fill="#c9c9c9">批次清单</text>
  <text x="996" y="246" font-size="11.5" fill="#a1a1a1">断点续跑</text>

  <path d="M220 208 H238" stroke="#a1a1a1" stroke-width="1.5" marker-end="url(#p5a)"/>
  <path d="M404 208 H422" stroke="#a1a1a1" stroke-width="1.5" marker-end="url(#p5a)"/>
  <path d="M588 208 H606" stroke="#a1a1a1" stroke-width="1.5" marker-end="url(#p5a)"/>
  <path d="M772 208 H790" stroke="#a1a1a1" stroke-width="1.5" marker-end="url(#p5a)"/>
  <path d="M956 208 H974" stroke="#a1a1a1" stroke-width="1.5" marker-end="url(#p5a)"/>

  <rect x="60" y="318" width="1080" height="88" rx="8" fill="#fafafa" stroke="#ebebeb" stroke-width="1.5"/>
  <text x="80" y="350" font-family="'DejaVu Sans Mono',Consolas,monospace" font-size="11" letter-spacing="1" fill="#767676">SINGLE FACTOR</text>
  <text x="80" y="378" font-size="13.5" fill="#4d4d4d">自动找表 → 选择唯一年度分区 → 解析日期 / 股票 / 因子列 → 审计 → 回测</text>
  <text x="80" y="398" font-size="11.5" fill="#767676">一次加载因子与实时收益，审计通过后直接复用内存数据</text>

  <rect x="60" y="424" width="1080" height="88" rx="8" fill="#fafafa" stroke="#ebebeb" stroke-width="1.5"/>
  <text x="80" y="456" font-family="'DejaVu Sans Mono',Consolas,monospace" font-size="11" letter-spacing="1" fill="#767676">ALL FACTORS</text>
  <text x="80" y="484" font-size="13.5" fill="#4d4d4d">扫描 schema → 展开多列 / 键值 / 宽表因子 → 收益只读一次 → 逐因子审计与回测</text>
  <text x="80" y="504" font-size="11.5" fill="#767676">单因子失败不丢弃其他结果；batch_manifest.json 持续记录状态、映射与耗时</text>

  <rect x="60" y="540" width="1080" height="146" rx="8" fill="#171717"/>
  <text x="80" y="576" font-size="16" font-weight="600" fill="#ffffff">边界不是提示词，而是运行时约束</text>
  <text x="80" y="604" font-family="'DejaVu Sans Mono',Consolas,monospace" font-size="11.5" fill="#c9c9c9">SERVER-SIDE SELECT-ONLY · SET TRANSACTION READ ONLY · ROLLBACK · NO ARBITRARY SQL · NO WRITE PROBES</text>
  <text x="80" y="628" font-family="'DejaVu Sans Mono',Consolas,monospace" font-size="11.5" fill="#c9c9c9">NO SILENT FALLBACK TO LOCAL RETURNS · ONE CALENDAR YEAR PER BATCH · --skip-existing RESUMES</text>
  <text x="80" y="656" font-family="'DejaVu Sans Mono',Consolas,monospace" font-size="11.5" fill="#a1a1a1">PASSWORDS STAY IN A LOOPBACK HELPER'S RAM; CONFIG FILES HOLD PROFILE NAMES, NEVER SECRETS</text>
</svg>
